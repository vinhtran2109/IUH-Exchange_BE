server:
  port: 8086
spring:
  application:
    name: lost-found-service
  config:
    import: "optional:configserver:http://config-admin:config-admin-password@localhost:8888"
  data:
    mongodb:
      uri: mongodb://lostfound_svc:lostfound_svc_pass@localhost:27018/iuh_lostfound?authSource=iuh_lostfound
      database: iuh_lostfound
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
eureka:
  client:
    service-url:
      defaultZone: http://eureka-admin:eureka-admin-password@localhost:8761/eureka/
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
