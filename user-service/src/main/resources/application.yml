server:
  port: 8081

spring:
  application:
    name: user-service

  config:
    import: "optional:configserver:http://config-admin:config-admin-password@localhost:8888"

  # MongoDB
  data:
    mongodb:
      uri: mongodb://user_svc:user_svc_pass@localhost:27018/iuh_users?authSource=iuh_users
      database: iuh_users

    # Redis
    redis:
      host: localhost
      port: 6379
      password: iuh_exchange_redis

  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: user-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.Map

  # Mail (SMTP) - Điền thông tin thực vào .env
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

  # Tắt Spring Security auto-config (dùng config riêng)
  security:
    user:
      name: "admin"
      password: "admin"

# ─────────────── AWS S3 Config (Avatar Storage) ───────────────
aws:
  s3:
    bucket-name: ${S3_BUCKET_NAME:s3-vinhtran}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

eureka:

  client:
    service-url:
      defaultZone: http://eureka-admin:eureka-admin-password@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:iuh-exchange-super-secret-key-change-in-production-2024}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# Kafka Topics
kafka:
  topics:
    user-registered: user.registered
    user-verified: user.verified

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    edu.iuh.exchange.userservice: DEBUG

