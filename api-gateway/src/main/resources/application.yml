server:
  port: 8080

spring:
  application:
    name: api-gateway
  
  # Dành cho Spring Boot 3.x: Tắt nạp từ xa triệt để
  config:
    import: ""
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: auth-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"
        - id: user-profile-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtAuthSafe
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products, /api/v1/products/**
          filters:
            - name: JwtAuthSafe
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders, /api/v1/orders/**
          filters:
            - name: JwtAuthSafe
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications, /api/v1/notifications/**
          filters:
            - name: JwtAuthSafe
        - id: lost-found-service
          uri: lb://lost-found-service
          predicates:
            - Path=/api/v1/lost-found, /api/v1/lost-found/**
          filters:
            - name: JwtAuthSafe
        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/api/v1/chat/**
          filters:
            - name: JwtAuthSafe
        - id: chat-websocket
          uri: lb://chat-service
          predicates:
            - Path=/ws/**
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:iuh_exchange_redis}
      timeout: 2000ms

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-admin:eureka-admin-password@localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:iuh-exchange-super-secret-key-change-in-production-2024}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    edu.iuh.exchange.gateway: DEBUG
