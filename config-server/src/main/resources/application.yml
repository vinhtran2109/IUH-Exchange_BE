server:
  port: 8888

spring:
  application:
    name: config-server

  # Lưu config trực tiếp trong file system (native profile)
  # Trong production, đổi sang git backend
  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo/{application}/{profile}
        # ── Git backend (uncomment for production) ──
        # git:
        #   uri: https://github.com/your-org/iuh-exchange-config
        #   default-label: main
        #   search-paths: '{application}'

  # Bảo mật Config Server bằng Basic Auth
  security:
    user:
      name: config-admin
      password: config-admin-password

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: false
