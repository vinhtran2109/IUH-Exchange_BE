# ============================================================
# IUH Campus Exchange Platform - Node.js Microservices
# ============================================================

networks:
  iuh-exchange-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  certbot_conf:
  certbot_www:

services:

  # ─────────────────────────────────────────────
  # MongoDB
  # ─────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: iuh-mongodb
    profiles:
      - local-db
    restart: unless-stopped
    # Do not publish MongoDB port on the host in production
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-iuh_exchange_root}
      MONGO_INITDB_DATABASE: iuh_exchange
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: iuh-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-iuh_exchange_redis}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-iuh_exchange_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Zookeeper
  # ─────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: iuh-zookeeper
    restart: unless-stopped
    # zookeeper port is internal only in production
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q 'Zookeeper version'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────
  # Kafka
  # ─────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: iuh-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - iuh-exchange-net

  # ─────────────────────────────────────────────
  # ElasticSearch
  # ─────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: iuh-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Logstash (ELK log pipeline)
  # ─────────────────────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: iuh-logstash
    profiles:
      - monitoring
    restart: unless-stopped
    # logstash ports are not published on host by default
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ./infra/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./infra/elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - iuh-exchange-net

  # ─────────────────────────────────────────────
  # Kibana (ELK Dashboard)
  # ─────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: iuh-kibana
    profiles:
      - monitoring
    restart: unless-stopped
    # Kibana should not be exposed on public interfaces by default
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - iuh-exchange-net

  # ============================================================
  # Node.js Backend Services
  # ============================================================

  # ─────────────────────────────────────────────
  # API Gateway
  # ─────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: iuh-api-gateway-node
    restart: unless-stopped
    # API Gateway runs behind nginx-lb; do not publish its port to host
    env_file: .env
    environment:
      PORT: "8080"
      SERVICE_NAME: api-gateway
      GATEWAY_PORT: "8080"
      LOGSTASH_URL: "${LOGSTASH_URL:-}"
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      CHAT_SERVICE_URL: http://chat-service:3005
      LOSTFOUND_SERVICE_URL: http://lost-found-service:3006
    depends_on:
      - redis
      - user-service
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # User Service
  # ─────────────────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    container_name: iuh-user-service-node
    restart: unless-stopped
    # Internal service; port not published in production
    env_file: .env
    environment:
      PORT: "3001"
      SERVICE_NAME: user-service
      MONGODB_URI: ${USER_SERVICE_MONGO_URI}
    depends_on:
      - redis
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # Product Service
  # ─────────────────────────────────────────────
  product-service:
    build:
      context: .
      dockerfile: Dockerfile.product-service
    container_name: iuh-product-service-node
    restart: unless-stopped
    # Internal service; port not published in production
    env_file: .env
    environment:
      PORT: "3002"
      SERVICE_NAME: product-service
      MONGODB_URI: ${PRODUCT_SERVICE_MONGO_URI}
    depends_on:
      - elasticsearch
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # Order Service
  # ─────────────────────────────────────────────
  order-service:
    build:
      context: .
      dockerfile: Dockerfile.order-service
    container_name: iuh-order-service-node
    restart: unless-stopped
    # Internal service; port not published in production
    env_file: .env
    environment:
      PORT: "3003"
      SERVICE_NAME: order-service
      MONGODB_URI: ${ORDER_SERVICE_MONGO_URI}
    depends_on:
      - redis
      - kafka
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # Notification Service
  # ─────────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.notification-service
    container_name: iuh-notification-service-node
    restart: unless-stopped
    # Internal service; port not published in production
    env_file: .env
    environment:
      PORT: "3004"
      SERVICE_NAME: notification-service
      MONGODB_URI: ${NOTIFICATION_SERVICE_MONGO_URI}
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
    volumes:
      - ${FIREBASE_ADMINSDK_PATH:-./iuhexchange-firebase-adminsdk-fbsvc-6dede7d24b.json}:/app/firebase-service-account.json:ro
    depends_on:
      - kafka
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # Chat Service
  # ─────────────────────────────────────────────
  chat-service:
    build:
      context: .
      dockerfile: Dockerfile.chat-service
    container_name: iuh-chat-service-node
    restart: unless-stopped
    # Internal service; port not published in production
    env_file: .env
    environment:
      PORT: "3005"
      SERVICE_NAME: chat-service
      MONGODB_URI: ${CHAT_SERVICE_MONGO_URI}
    depends_on:
      - redis
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # Lost & Found Service
  # ─────────────────────────────────────────────
  lost-found-service:
    build:
      context: .
      dockerfile: Dockerfile.lost-found-service
    container_name: iuh-lost-found-service-node
    restart: unless-stopped
    # Internal service; port not published in production
    env_file: .env
    environment:
      PORT: "3006"
      SERVICE_NAME: lost-found-service
      MONGODB_URI: ${LOSTFOUND_SERVICE_MONGO_URI}
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # WebSocket Gateway (separated)
  # ─────────────────────────────────────────────
  ws-gateway:
    build:
      context: .
      dockerfile: Dockerfile.ws-gateway
    container_name: iuh-ws-gateway-node
    restart: unless-stopped
    # Internal service; websocket gateway runs behind nginx-lb
    env_file: .env
    environment:
      PORT: "3007"
      SERVICE_NAME: ws-gateway
      CHAT_SERVICE_URL: http://chat-service:3005
    depends_on:
      - redis
      - chat-service
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3007/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # NGINX Load Balancer (Staging)
  # Start with: docker compose --profile lb up -d
  # ─────────────────────────────────────────────
  nginx-lb:
    image: nginx:1.25-alpine
    container_name: iuh-nginx-lb
    restart: unless-stopped
    profiles:
      - lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./infra/certbot/www:/var/www/certbot:ro
    depends_on:
      - api-gateway
      - ws-gateway
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────
  # Certbot (Let's Encrypt SSL)
  # ─────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: iuh-certbot
    profiles:
      - lb
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - iuh-exchange-net

  # ─────────────────────────────────────────────
  # Prometheus (Metrics Collection)
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: iuh-prometheus
    profiles:
      - monitoring
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - iuh-exchange-net

  # ─────────────────────────────────────────────
  # Grafana (Monitoring Dashboard)
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: iuh-grafana
    profiles:
      - monitoring
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: iuh_exchange_grafana
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - iuh-exchange-net
