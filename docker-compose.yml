version: "3.9"

# ============================================================
# IUH Campus Exchange Platform - Core Infrastructure
# Phase 1: Setup Infrastructure Core
# ============================================================

networks:
  iuh-exchange-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  elasticsearch_data:

services:

  # ─────────────────────────────────────────────
  # MongoDB - Primary Data Storage
  # ─────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: iuh-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: iuh_exchange_root
      MONGO_INITDB_DATABASE: iuh_exchange
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis - Caching & Rate Limiting
  # ─────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: iuh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass iuh_exchange_redis
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "iuh_exchange_redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Zookeeper - Required by Kafka
  # ─────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: iuh-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Kafka - Message Broker
  # ─────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: iuh-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      # Dead Letter Queue settings
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ─────────────────────────────────────────────
  # Kafka UI - Web Console for Kafka Management
  # ─────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: iuh-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: iuh-exchange-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - iuh-exchange-net

  # ─────────────────────────────────────────────
  # ElasticSearch - Search Engine
  # ─────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: iuh-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ─────────────────────────────────────────────
  # Kibana - ElasticSearch Visualization
  # ─────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: iuh-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - iuh-exchange-net

  # ============================================================
  # IUH Campus Exchange Platform - Backend Services (Phase 2)
  # ============================================================

  # ─────────────────────────────────────────────
  # Service Registry (Eureka)
  # ─────────────────────────────────────────────
  service-registry:
    build: ./service-registry
    container_name: iuh-service-registry
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: service-registry
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-admin:eureka-admin-password@service-registry:8761/eureka/
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Config Server
  # ─────────────────────────────────────────────
  config-server:
    build: ./config-server
    container_name: iuh-config-server
    restart: unless-stopped
    depends_on:
      service-registry:
        condition: service_healthy
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-admin:eureka-admin-password@service-registry:8761/eureka/
    networks:
      - iuh-exchange-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://config-admin:config-admin-password@localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # API Gateway
  # ─────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    container_name: iuh-api-gateway
    restart: unless-stopped
    depends_on:
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Bỏ config server để dùng local config cho API Gateway (Fix Filter bug)
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-admin:eureka-admin-password@service-registry:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: iuh_exchange_redis
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
    networks:
      - iuh-exchange-net

  # ─────────────────────────────────────────────
  # User Service
  # ─────────────────────────────────────────────
  user-service:
    build: ./user-service
    container_name: iuh-user-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-admin:eureka-admin-password@service-registry:8761/eureka/
      SPRING_DATA_MONGODB_URI: "mongodb://user_svc:user_svc_pass@mongodb:27017/iuh_users?authSource=iuh_users"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: iuh_exchange_redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # JWT Config (Synchronized)
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      # AWS config
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    networks:
      - iuh-exchange-net

  # ─────────────────────────────────────────────
  # Product Service
  # ─────────────────────────────────────────────
  product-service:
    build: ./product-service
    container_name: iuh-product-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-admin:eureka-admin-password@service-registry:8761/eureka/
      SPRING_DATA_MONGODB_URI: "mongodb://product_svc:product_svc_pass@mongodb:27017/iuh_products?authSource=iuh_products"
      SPRING_ELASTICSEARCH_URIS: "http://elasticsearch:9200"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # JWT Config (Synchronized)
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      # AWS Config
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    networks:
      - iuh-exchange-net

  # ─────────────────────────────────────────────
  # Order Service
  # ─────────────────────────────────────────────
  order-service:
    build: ./order-service
    container_name: iuh-order-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_IMPORT: "optional:configserver:http://config-admin:config-admin-password@config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-admin:eureka-admin-password@service-registry:8761/eureka/
      SPRING_DATA_MONGODB_URI: "mongodb://order_svc:order_svc_pass@mongodb:27017/iuh_orders?authSource=iuh_orders"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: iuh_exchange_redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # JWT Config (Synchronized)
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
    networks:
      - iuh-exchange-net

  # ─────────────────────────────────────────────
  # Notification Service
  # ─────────────────────────────────────────────
  notification-service:
    build: ./notification-service
    container_name: iuh-notification-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_IMPORT: "optional:configserver:http://config-admin:config-admin-password@config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-admin:eureka-admin-password@service-registry:8761/eureka/
      SPRING_DATA_MONGODB_URI: "mongodb://notification_svc:notification_svc_pass@mongodb:27017/iuh_notifications?authSource=iuh_notifications"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # JWT Config (Synchronized)
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
    networks:
      - iuh-exchange-net

  # ─────────────────────────────────────────────
  # Chat Service
  # ─────────────────────────────────────────────
  chat-service:
    build: ./chat-service
    container_name: iuh-chat-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_IMPORT: "optional:configserver:http://config-admin:config-admin-password@config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-admin:eureka-admin-password@service-registry:8761/eureka/
      SPRING_DATA_MONGODB_URI: "mongodb://chat_svc:chat_svc_pass@mongodb:27017/iuh_chat?authSource=iuh_chat"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: iuh_exchange_redis
      # JWT Config (Synchronized)
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
    networks:
      - iuh-exchange-net

  # ─────────────────────────────────────────────
  # Lost & Found Service
  # ─────────────────────────────────────────────
  lost-found-service:
    build: ./lost-found-service
    container_name: iuh-lost-found-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_IMPORT: "optional:configserver:http://config-admin:config-admin-password@config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-admin:eureka-admin-password@service-registry:8761/eureka/
      SPRING_DATA_MONGODB_URI: "mongodb://lostfound_svc:lostfound_svc_pass@mongodb:27017/iuh_lostfound?authSource=iuh_lostfound"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    networks:
      - iuh-exchange-net

  # ============================================================
  # IUH Campus Exchange Platform - Frontend (Phase 3)
  # ============================================================

  frontend:
    build: ./frontend
    container_name: iuh-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "3000:80"
    networks:
      - iuh-exchange-net
