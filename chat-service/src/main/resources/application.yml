server:
  port: 8085
spring:
  application:
    name: chat-service
  config:
    import: "optional:configserver:http://config-admin:config-admin-password@localhost:8888"
  data:
    mongodb:
      uri: mongodb://chat_svc:chat_svc_pass@localhost:27018/iuh_chat?authSource=iuh_chat
      database: iuh_chat
    redis:
      host: localhost
      port: 6379
      password: iuh_exchange_redis
eureka:
  client:
    service-url:
      defaultZone: http://eureka-admin:eureka-admin-password@localhost:8761/eureka/
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
