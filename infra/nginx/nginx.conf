# ============================================================
# NGINX Load Balancer - IUH Exchange Staging
# ============================================================
# Usage:
#   docker compose --profile lb up -d
#
# Place this file at: infra/nginx/nginx.conf
# ============================================================

upstream api_gateway {
    least_conn;
    server api-gateway:8080 max_fails=3 fail_timeout=30s;
    # Add more instances for horizontal scaling:
    # server api-gateway-2:8080 max_fails=3 fail_timeout=30s;
}

upstream ws_gateway {
    ip_hash;  # Sticky sessions for WebSocket
    server ws-gateway:3007 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 256;

    # Health check endpoint for the LB itself
    location /nginx-health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx-lb"}';
        add_header Content-Type application/json;
    }

    # API routes → API Gateway
    location /api/ {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Rate limiting
        limit_req zone=api burst=50 nodelay;
    }

    # WebSocket routes → WS Gateway
    location /ws/ {
        proxy_pass http://ws_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Frontend static files (if served by NGINX)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

# Rate limiting zones (defined at http level in main nginx.conf)
# limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
