upstream api_gateway {
    least_conn;
    server api-gateway:8080 max_fails=3 fail_timeout=30s;
}

upstream ws_gateway {
    ip_hash;
    server ws-gateway:3007 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name iuhexchange.site www.iuhexchange.site 3.237.77.136;

    location /nginx-health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"nginx-lb"}';
    }

    location / {
        return 301 https://iuhexchange.site$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name 3.237.77.136;

    ssl_certificate /etc/letsencrypt/live/iuhexchange.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iuhexchange.site/privkey.pem;

    return 301 https://iuhexchange.site$request_uri;
}

server {
    listen 443 ssl http2;
    server_name iuhexchange.site www.iuhexchange.site;

    ssl_certificate /etc/letsencrypt/live/iuhexchange.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iuhexchange.site/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 256;

    location /nginx-health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"nginx-lb"}';
    }

    location /api/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /ws/ {
        proxy_pass http://ws_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
