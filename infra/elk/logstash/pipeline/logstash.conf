input {
  # Read JSON logs from stdin (piped from Docker logging driver or filebeat)
  stdin {
    codec => json_lines
  }

  # Read logs from Kafka topics published by microservices
  kafka {
    bootstrap_servers => "${KAFKA_BROKERS:kafka:29092}"
    topics_pattern => "iuh-exchange-.*"
    group_id => "logstash-consumer"
    codec => json
    decorate_events => true
    auto_offset_reset => "earliest"
    # Consumer settings
    consumer_threads => 2
    fetch_max_bytes => 1048576
  }
}

filter {
  # Parse the service name
  if [service] {
    mutate {
      add_field => { "[@metadata][service]" => "%{service}" }
    }
  } else if [@metadata][kafka][topic] {
    # Extract service name from Kafka topic (e.g., iuh-exchange-order → order)
    grok {
      match => { "[@metadata][kafka][topic]" => "iuh-exchange-%{DATA:service_from_topic}" }
      tag_on_failure => []
    }
    mutate {
      add_field => { "[@metadata][service]" => "%{service_from_topic}" }
      remove_field => [ "service_from_topic" ]
    }
  } else {
    mutate {
      add_field => { "[@metadata][service]" => "unknown" }
    }
  }

  # Parse timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "YYYY-MM-DD HH:mm:ss", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # Parse log level
  if [level] {
    mutate {
      lowercase => [ "level" ]
    }
  }

  # Add environment tag
  mutate {
    add_tag => [ "iuh-exchange" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "iuh-exchange-%{[@metadata][service]}-%{+YYYY.MM.dd}"
    template_name => "iuh-exchange"
    template_overwrite => true
  }

  # Debug: uncomment to see output
  # stdout { codec => rubydebug }
}
