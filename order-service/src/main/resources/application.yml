server:
  port: 8083
spring:
  application:
    name: order-service
  config:
    import: "optional:configserver:http://config-admin:config-admin-password@localhost:8888"
  data:
    mongodb:
      uri: mongodb://order_svc:order_svc_pass@localhost:27018/iuh_orders?authSource=iuh_orders
      database: iuh_orders
    redis:
      host: localhost
      port: 6379
      password: iuh_exchange_redis
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
eureka:
  client:
    service-url:
      defaultZone: http://eureka-admin:eureka-admin-password@localhost:8761/eureka/
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
